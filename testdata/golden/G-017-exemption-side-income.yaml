# GOLDEN CASE
# Review status: UNVERIFIED — awaiting practitioner sign-off.

id: G-017
title: "Minimum wage earner with side income breaking employment-only exemption"
kind: compute
year_of_assessment: 2026
jurisdiction: NG
rule_set_version: "0.1.0-draft"

why_this_case: >
  Tests scope restriction on minimum wage exemption. Earner has ₦840,000 employment income
  plus ₦1 dividend income. The ₦1 non-employment income breaks the employment-only scope,
  causing exemption to fail. Tax payable is ₦6,000.15 on ₦840,001 chargeable income.

given:
  residency: resident
  months_employed: 12
  income:
    - { category: EMPLOYMENT, label: "Wages", naira: 840000 }
    - { category: DIVIDEND,   label: "Dividend", naira: 1 }
  declared_bases: {}
  reliefs: []
  credits: []

expect:
  gross_income:        840001
  total_reliefs:            0
  chargeable_income:   840001
  bands:
    - { slice: "0 – 800,000",         amount: 800000, rate: "0%",  tax:       0 }
    - { slice: "800,000 – 3,000,000", amount:  40001, rate: "15%", tax: 6000.15 }
  tax_payable:           6000.15
  total_credits:            0
  balance:               6000.15
  exemption_applied:     null

review: { status: UNVERIFIED, reviewer_name: "", reviewer_membership_no: "", reviewed_at: null, comments: "" }
