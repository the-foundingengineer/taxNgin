# GOLDEN CASE
# Review status: UNVERIFIED — awaiting practitioner sign-off.

id: G-031
title: "Foreign income declared with foreign tax credit (v1.5 gap)"
kind: compute
year_of_assessment: 2026
jurisdiction: NG
rule_set_version: "0.1.0-draft"

why_this_case: >
  Tests foreign income and foreign tax credit. Documents the v1.5 gap: foreign tax credit
  capping is not implemented in the v1 engine; credit is passed through without capping.

given:
  residency: resident
  months_employed: 12
  income:
    - { category: FOREIGN, label: "UK consulting income", naira: 5000000 }
  declared_bases: {}
  reliefs: []
  credits:
    - { code: FOREIGN_TAX_CREDIT, naira: 600000 }

expect:
  gross_income:       5000000
  total_reliefs:            0
  chargeable_income:  5000000
  bands:
    - { slice: "0 – 800,000",            amount:  800000, rate: "0%",  tax:      0 }
    - { slice: "800,000 – 3,000,000",    amount: 2200000, rate: "15%", tax: 330000 }
    - { slice: "3,000,000 – 5,000,000",  amount: 2000000, rate: "18%", tax: 360000 }
  tax_payable:         690000
  total_credits:       600000
  balance:              90000
  gap: "Foreign tax credit capping is not implemented in v1 engine; credit is passed through without cap."

review: { status: UNVERIFIED, reviewer_name: "", reviewer_membership_no: "", reviewed_at: null, comments: "" }
