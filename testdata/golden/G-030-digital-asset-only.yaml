# GOLDEN CASE
# Review status: UNVERIFIED — awaiting practitioner sign-off.

id: G-030
title: "Digital asset gain as sole income source"
kind: compute
year_of_assessment: 2026
jurisdiction: NG
rule_set_version: "0.1.0-draft"

why_this_case: >
  Tests NTA 2025 s.4 taxable digital asset gains as a sole income category.
  Gross ₦4,000,000 digital asset gain produces ₦510,000 tax payable.

given:
  residency: resident
  months_employed: 12
  income:
    - { category: DIGITAL_ASSET_GAIN, label: "Crypto gain", naira: 4000000 }
  declared_bases: {}
  reliefs: []
  credits: []

expect:
  gross_income:       4000000
  total_reliefs:            0
  chargeable_income:  4000000
  bands:
    - { slice: "0 – 800,000",            amount:  800000, rate: "0%",  tax:      0 }
    - { slice: "800,000 – 3,000,000",    amount: 2200000, rate: "15%", tax: 330000 }
    - { slice: "3,000,000 – 4,000,000",  amount: 1000000, rate: "18%", tax: 180000 }
  tax_payable:         510000
  total_credits:            0
  balance:             510000

review: { status: UNVERIFIED, reviewer_name: "", reviewer_membership_no: "", reviewed_at: null, comments: "" }
